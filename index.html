<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d99aaa">
<link rel="manifest" href="manifest.webmanifest">
<title>Mijn Budgetplanner</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Parisienne&display=swap');
:root{--pink:#d99aaa;--pink2:#f4dfe5;--pink3:#fff7f9;--text:#3f393b;--muted:#8d8588;--line:#eadfe2;--green:#76947d;--red:#b96570;--bg:#fcfaf9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"DM Sans",Arial,sans-serif}
button,input,select{font:inherit}button{cursor:pointer;border:0}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:100px}
header{padding:24px 20px 8px;display:flex;align-items:center;justify-content:space-between}
.month{font-weight:700;letter-spacing:2px;font-size:22px}.month button{background:transparent;font-size:28px;color:#5e5759;padding:4px 10px}
.page{display:none;padding:8px 20px}.page.active{display:block}
.script{font-family:Parisienne,cursive;color:#ad7181;font-size:44px;line-height:1.1;margin:15px 0}
.card{background:white;border:1px solid var(--line);border-radius:24px;padding:18px;margin:12px 0;box-shadow:0 6px 22px rgba(80,50,60,.04)}
.hero{padding:24px}.hero .label{font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:#9a747f;font-weight:700}.hero .big{font-size:42px;font-weight:700;margin:8px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.small{font-size:13px;color:var(--muted);margin-top:4px}.amount{font-weight:700;font-size:18px}.plus{color:var(--green)}.minus{color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.quick{background:var(--pink2);color:#76505b;border-radius:18px;padding:18px 10px;text-align:center;font-weight:700;font-size:16px}
.primary{background:var(--pink2);color:#76505b;border-radius:18px;padding:14px 18px;font-weight:700;width:100%}.outline{background:white;border:1px solid #dfc6cd;color:#9f6172;border-radius:18px;padding:12px 16px;font-weight:700}
.action-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.action-row button{background:#faf0f3;color:#875a66;border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600}.action-row .danger{background:#fff0f1;color:#b05e68}
.tabs{display:flex;background:#f1edef;border-radius:30px;padding:6px;margin:10px 0 18px}.tabs button{flex:1;background:transparent;padding:11px;border-radius:25px;color:#725c63;font-weight:700}.tabs button.active{background:white;color:#b87484}
.progress{height:10px;background:#f0ecee;border-radius:10px;overflow:hidden;margin:12px 0}.progress>span{display:block;height:100%;background:var(--pink);border-radius:10px}
.form{background:white;border:1px solid var(--line);border-radius:24px;padding:20px;margin:12px 0}.form h3{margin-top:0}.field{margin:12px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}.field input,.field select{width:100%;padding:12px 13px;border:1px solid #dfd4d7;border-radius:13px;background:#fff;color:var(--text)}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);background:white;border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:9px 8px calc(9px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 -5px 20px rgba(70,40,50,.06);z-index:10}
.bottom button{background:transparent;color:#70696b;font-size:12px;font-weight:700;padding:8px 2px;border-radius:16px}.bottom button.active{background:#faedf1;color:#c17d8e}.bottom .ico{display:block;font-size:22px;margin-bottom:3px}
.empty{text-align:center;color:var(--muted);padding:24px 8px}.danger-note{color:var(--red);font-weight:600}.divider{border-top:1px solid #eee5e7;margin:15px 0}
.modal-back{position:fixed;inset:0;background:rgba(40,25,30,.28);display:none;align-items:flex-end;justify-content:center;z-index:20}.modal-back.show{display:flex}.modal{background:var(--bg);width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:22px 20px 35px}.modal-title{font-size:22px;font-weight:700;margin-bottom:5px}
@media(min-width:700px){.modal-back{align-items:center}.modal{border-radius:28px;max-width:560px}}
</style>
</head>
<body>
<div class="app">
<header><div></div><div class="month"><button id="prevMonth">‹</button><span id="monthLabel"></span><button id="nextMonth">›</button></div><button id="resetBtn" class="outline" style="padding:7px 10px">Reset</button></header>

<main>
<section id="home" class="page active">
  <div class="script">Mijn geld</div>
  <div class="card hero"><div class="label">Vrij beschikbaar</div><div class="big" id="homeAvailable">€ 0,00</div><div class="small">Inkomsten minus uitgaven en geplande pot-inleg.</div></div>
  <div class="grid2">
    <button class="quick" data-action="income">＋ Inkomst</button>
    <button class="quick" data-action="expense">− Uitgave</button>
    <button class="quick" data-action="pot">♡ Potje</button>
    <button class="quick" data-action="budget">€ Budget</button>
  </div>
  <div class="script">Mijn maand</div>
  <div id="homeSummary"></div>
  <div class="script">Recente transacties</div>
  <div id="homeTransactions"></div>
</section>

<section id="transactions" class="page">
  <div class="script">Transacties</div>
  <div class="tabs"><button id="txOut" class="active">Uitgaven</button><button id="txIn">Inkomsten</button></div>
  <button class="primary" data-action="transaction">＋ Transactie toevoegen</button>
  <div id="txList"></div>
</section>

<section id="accounts" class="page">
  <div class="script">Rekeningen</div>
  <button class="primary" data-action="account">＋ Rekening toevoegen</button>
  <div id="accountList"></div>
</section>

<section id="pots" class="page">
  <div class="script">Potjes</div>
  <div class="small">Helemaal leeg beginnen? Voeg alleen de potjes toe die jij nodig hebt.</div>
  <button class="primary" data-action="pot" style="margin-top:12px">＋ Nieuw potje</button>
  <div id="potList"></div>
</section>

<section id="budgets" class="page">
  <div class="script">Budgetten</div>
  <div class="small">Maak per categorie een bedrag dat je deze maand wilt uitgeven.</div>
  <button class="primary" data-action="budget" style="margin-top:12px">＋ Nieuw budget</button>
  <div id="budgetList"></div>
</section>

<section id="insights" class="page">
  <div class="script">Inzichten</div>
  <div id="insightList"></div>
</section>
</main>

<nav class="bottom">
<button data-nav="home" class="active"><span class="ico">✿</span>Home</button>
<button data-nav="insights"><span class="ico">◷</span>Inzichten</button>
<button data-nav="transactions"><span class="ico">▤</span>Transacties</button>
<button data-nav="accounts"><span class="ico">♜</span>Rekeningen</button>
<button data-nav="pots"><span class="ico">◇</span>Potjes</button>
</nav>
</div>

<div id="modalBack" class="modal-back"><div class="modal"><div class="row"><div><div class="modal-title" id="modalTitle"></div><div class="small" id="modalSub"></div></div><button id="modalClose" class="outline">Sluiten</button></div><div id="modalBody"></div></div></div>

<script>
const KEY='mijn_budgetplanner_clean_v1';
const euro=new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'});
const eur=n=>euro.format(Number(n)||0);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toISOString().slice(0,10);
const monthKey=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')};

let state=JSON.parse(localStorage.getItem(KEY)||'null')||{
  transactions:[], accounts:[], pots:[], budgets:[],
  incomeCategories:['Salaris','Kinderbijslag','Toeslagen','Overige inkomsten'],
  expenseCategories:['Boodschappen','Wonen','Vervoer','Kleding','Kinderen','Huisdieren','Sport','Leuke dingen','Vakantie','Overig']
};
let viewMonth=new Date(); viewMonth.setDate(1);
let txType='out';

function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function monthTransactions(){const k=viewMonth.getFullYear()+'-'+String(viewMonth.getMonth()+1).padStart(2,'0');return state.transactions.filter(t=>t.date.slice(0,7)===k)}
function monthName(){return viewMonth.toLocaleDateString('nl-NL',{month:'long',year:'numeric'}).toUpperCase()}
function showPage(id){
 document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));
 document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===id));
 render();
 window.scrollTo(0,0);
}
function render(){
 document.getElementById('monthLabel').textContent=monthName();
 renderHome();renderTransactions();renderAccounts();renderPots();renderBudgets();renderInsights();
}
function renderHome(){
 const tx=monthTransactions(), income=tx.filter(t=>t.type==='in').reduce((s,t)=>s+t.amount,0), out=tx.filter(t=>t.type==='out').reduce((s,t)=>s+t.amount,0);
 const available=income-out;
 document.getElementById('homeAvailable').textContent=eur(available);
 document.getElementById('homeSummary').innerHTML=`
 <div class="card"><div class="row"><span>Inkomsten</span><b class="plus">${eur(income)}</b></div>
 <div class="row"><span>Uitgaven</span><b class="minus">${eur(out)}</b></div>
 <div class="row"><span>Saldo deze maand</span><b>${eur(available)}</b></div></div>`;
 const recent=[...tx].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
 document.getElementById('homeTransactions').innerHTML=recent.length?recent.map(t=>transactionCard(t,false)).join(''):'<div class="card empty">Nog geen transacties. Je begint helemaal schoon.</div>';
}
function transactionCard(t,actions=true){
 const idx=state.transactions.findIndex(x=>x.id===t.id);
 const account=t.accountId?state.accounts.find(a=>a.id===t.accountId):null;
 return `<div class="card"><div class="row"><span><b>${esc(t.description)}</b><div class="small">${nlDate(t.date)} · ${esc(t.category)}${account?' · '+esc(account.name):t.method==='cash'?' · Contant':''}</div></span><b class="amount ${t.type==='in'?'plus':'minus'}">${t.type==='in'?'+':'−'}${eur(t.amount)}</b></div>
 ${actions?`<div class="action-row"><button data-edit-tx="${idx}">Aanpassen</button><button class="danger" data-delete-tx="${idx}">Verwijderen</button></div>`:''}</div>`;
}
function renderTransactions(){
 const list=monthTransactions().filter(t=>t.type===txType).sort((a,b)=>b.date.localeCompare(a.date));
 document.getElementById('txList').innerHTML=list.length?list.map(t=>transactionCard(t,true)).join(''):'<div class="card empty">Geen '+(txType==='in'?'inkomsten':'uitgaven')+' in '+monthName().toLowerCase()+'.</div>';
}
function renderAccounts(){
 const el=document.getElementById('accountList');
 el.innerHTML=state.accounts.length?state.accounts.map((a,i)=>`<div class="card"><div class="row"><span><b>${esc(a.name)}</b><div class="small">${a.type==='debt'?'Creditcard / schuld':'Bankrekening'}</div></span><b class="amount ${a.type==='debt'?'minus':''}">${eur(a.balance)}</b></div><div class="action-row"><button data-edit-account="${i}">Aanpassen</button><button class="danger" data-delete-account="${i}">Verwijderen</button></div></div>`).join(''):'<div class="card empty">Nog geen rekeningen. Voeg alleen toe wat je gebruikt.</div>';
}
function renderPots(){
 const el=document.getElementById('potList');
 el.innerHTML=state.pots.length?state.pots.map((p,i)=>{
   const saved=p.contributions.reduce((s,c)=>s+c.amount,0), pct=p.target?Math.min(100,saved/p.target*100):0;
   return `<div class="card"><div class="row"><span><b>${esc(p.name)}</b><div class="small">${eur(saved)} van ${eur(p.target)}</div></span><b>${Math.round(pct)}%</b></div><div class="progress"><span style="width:${pct}%"></span></div><div class="action-row"><button data-pot-detail="${i}">Bekijk inleg</button><button data-add-pot="${i}">＋ Inleggen</button><button data-edit-pot="${i}">Aanpassen</button><button class="danger" data-delete-pot="${i}">Verwijderen</button></div></div>`
 }).join(''):'<div class="card empty">Nog geen potjes. Dat is expres: je begint schoon en maakt alleen aan wat je nodig hebt.</div>';
}
function renderBudgets(){
 const el=document.getElementById('budgetList'),tx=monthTransactions().filter(t=>t.type==='out');
 el.innerHTML=state.budgets.length?state.budgets.map((b,i)=>{
   const spent=tx.filter(t=>t.category===b.category).reduce((s,t)=>s+t.amount,0), left=b.amount-spent,pct=b.amount?Math.min(100,spent/b.amount*100):0;
   return `<div class="card"><div class="row"><span><b>${esc(b.category)}</b><div class="small">Budget ${eur(b.amount)}</div></span><b class="${left<0?'minus':'plus'}">${left<0?'−':''}${eur(Math.abs(left))} ${left<0?'over':'over'}</b></div><div class="progress"><span style="width:${pct}%"></span></div><div class="row small"><span>${eur(spent)} uitgegeven</span><span>${Math.round(pct)}%</span></div><div class="action-row"><button data-edit-budget="${i}">Aanpassen</button><button class="danger" data-delete-budget="${i}">Verwijderen</button></div></div>`
 }).join(''):'<div class="card empty">Nog geen budgetten. Maak bijvoorbeeld een budget voor Boodschappen of Leuke dingen.</div>';
}
function renderInsights(){
 const tx=monthTransactions(),inc=tx.filter(t=>t.type==='in').reduce((s,t)=>s+t.amount,0),out=tx.filter(t=>t.type==='out').reduce((s,t)=>s+t.amount,0);
 const cat={};tx.filter(t=>t.type==='out').forEach(t=>cat[t.category]=(cat[t.category]||0)+t.amount);
 const rows=Object.entries(cat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b>${eur(v)}</b></div>`).join('');
 document.getElementById('insightList').innerHTML=`<div class="card"><div class="row"><span>Inkomsten</span><b class="plus">${eur(inc)}</b></div><div class="row"><span>Uitgaven</span><b class="minus">${eur(out)}</b></div><div class="row"><span>Verschil</span><b>${eur(inc-out)}</b></div></div><div class="card"><b>Uitgaven per categorie</b><div class="divider"></div>${rows||'<div class="empty">Nog geen uitgaven.</div>'}</div>`;
}
function nlDate(s){return new Date(s+'T12:00').toLocaleDateString('nl-NL')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function openModal(title,sub,body,onSave){
 document.getElementById('modalTitle').textContent=title;document.getElementById('modalSub').textContent=sub||'';
 document.getElementById('modalBody').innerHTML=body;document.getElementById('modalBack').classList.add('show');
 const form=document.getElementById('modalBody').querySelector('form'); if(form)form.onsubmit=e=>{e.preventDefault();onSave(new FormData(form));closeModal()};
}
function closeModal(){document.getElementById('modalBack').classList.remove('show');document.getElementById('modalBody').innerHTML=''}
function transactionForm(t=null){
 const isIn=t?.type==='in',cats=isIn?state.incomeCategories:state.expenseCategories;
 return `<form><div class="field"><label>Bedrag</label><input name="amount" type="number" step="0.01" min="0.01" required value="${t?.amount||''}"></div>
 <div class="field"><label>Omschrijving</label><input name="description" required value="${esc(t?.description||'')}"></div>
 <div class="field"><label>Datum</label><input name="date" type="date" required value="${t?.date||today()}"></div>
 <div class="field"><label>Categorie</label><select name="category">${cats.map(c=>`<option ${c===t?.category?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
 <div class="field"><label>Waar komt het geld vandaan / waar gaat het vanaf?</label><select name="method"><option value="bank" ${t?.method!=='cash'?'selected':''}>Bankrekening</option><option value="cash" ${t?.method==='cash'?'selected':''}>Contant</option></select></div>
 <div class="field"><label>Bankrekening (optioneel)</label><select name="accountId"><option value="">Geen rekening kiezen</option>${state.accounts.map(a=>`<option value="${a.id}" ${a.id===t?.accountId?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div>
 <button class="primary">Opslaan</button></form>`;
}
function addTransaction(type,editIndex=null){
 const t=editIndex!==null?state.transactions[editIndex]:{type};
 openModal(editIndex!==null?'Transactie aanpassen':(type==='in'?'Inkomst toevoegen':'Uitgave toevoegen'),'Alles wat je invult blijft op je telefoon bewaard.',transactionForm(t),fd=>{
   const obj={id:t.id||uid(),type,amount:Number(fd.get('amount')),description:fd.get('description'),date:fd.get('date'),category:fd.get('category'),method:fd.get('method'),accountId:fd.get('accountId')||''};
   if(editIndex!==null)state.transactions[editIndex]=obj;else state.transactions.push(obj);save();render();
 });
}
function addAccount(edit=null){
 const a=edit!==null?state.accounts[edit]:{};
 openModal(edit!==null?'Rekening aanpassen':'Rekening toevoegen','Je kunt later altijd aanpassen of verwijderen.',`<form><div class="field"><label>Naam</label><input name="name" required value="${esc(a.name||'')}"></div><div class="field"><label>Type</label><select name="type"><option value="bank" ${a.type!=='debt'?'selected':''}>Bankrekening</option><option value="debt" ${a.type==='debt'?'selected':''}>Creditcard / schuld</option></select></div><div class="field"><label>Huidig saldo</label><input name="balance" type="number" step="0.01" value="${a.balance||0}"></div><button class="primary">Opslaan</button></form>`,fd=>{
   const obj={id:a.id||uid(),name:fd.get('name'),type:fd.get('type'),balance:Number(fd.get('balance')||0)};
   if(edit!==null)state.accounts[edit]=obj;else state.accounts.push(obj);save();render();
 });
}
function addPot(edit=null){
 const p=edit!==null?state.pots[edit]:{name:'',target:0,contributions:[]};
 openModal(edit!==null?'Potje aanpassen':'Nieuw potje','Je begint schoon: alleen dit potje wordt aangemaakt.',`<form><div class="field"><label>Naam van het potje</label><input name="name" required value="${esc(p.name)}"></div><div class="field"><label>Doelbedrag</label><input name="target" type="number" step="0.01" min="0" required value="${p.target||''}"></div><button class="primary">Opslaan</button></form>`,fd=>{
   const obj={id:p.id||uid(),name:fd.get('name'),target:Number(fd.get('target')||0),contributions:p.contributions||[]};
   if(edit!==null)state.pots[edit]=obj;else state.pots.push(obj);save();render();
 });
}
function addContribution(i){
 const p=state.pots[i];
 openModal('Inleg in '+p.name,'Elke inleg krijgt een eigen datum en omschrijving.',`<form><div class="field"><label>Bedrag</label><input name="amount" type="number" step="0.01" min="0.01" required></div><div class="field"><label>Datum</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>Omschrijving</label><input name="note" value="Inleg"></div><button class="primary">Inleg opslaan</button></form>`,fd=>{
   p.contributions.push({id:uid(),amount:Number(fd.get('amount')),date:fd.get('date'),note:fd.get('note')||'Inleg'});save();render();showPotDetail(i);
 });
}
function showPotDetail(i){
 const p=state.pots[i], total=p.contributions.reduce((s,c)=>s+c.amount,0);
 const rows=p.contributions.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(c=>{
   const j=p.contributions.indexOf(c);
   return `<div class="card"><div class="row"><span><b>${esc(c.note||'Inleg')}</b><div class="small">${nlDate(c.date)}</div></span><b>${eur(c.amount)}</b></div><div class="action-row"><button data-edit-con="${i}:${j}">Aanpassen</button><button class="danger" data-delete-con="${i}:${j}">Verwijderen</button></div></div>`
 }).join('');
 openModal(p.name,'Inlegoverzicht',`<div class="card"><div class="row"><span>Gespaard</span><b>${eur(total)}</b></div><div class="row"><span>Doel</span><b>${eur(p.target)}</b></div></div>${rows||'<div class="empty">Nog geen inleg. Voeg hieronder je eerste inleg toe.</div>'}<button class="primary" data-modal-add-con="${i}">＋ Inleg toevoegen</button>`);
}
function addBudget(edit=null){
 const b=edit!==null?state.budgets[edit]:{};
 openModal(edit!==null?'Budget aanpassen':'Nieuw budget','Een budget geldt voor de gekozen maand.',`<form><div class="field"><label>Categorie</label><input name="category" list="catlist" required value="${esc(b.category||'')}"><datalist id="catlist">${state.expenseCategories.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div><div class="field"><label>Budgetbedrag</label><input name="amount" type="number" step="0.01" min="0.01" required value="${b.amount||''}"></div><button class="primary">Opslaan</button></form>`,fd=>{
   const obj={id:b.id||uid(),category:fd.get('category'),amount:Number(fd.get('amount'))};
   if(edit!==null)state.budgets[edit]=obj;else state.budgets.push(obj);save();render();
 });
}
function deleteConfirm(message,fn){if(confirm(message)){fn();save();render()}}
function resetAll(){
 if(!confirm('Alles wissen en helemaal opnieuw beginnen? Dit verwijdert alle inkomsten, uitgaven, rekeningen, potjes en budgetten op dit apparaat.'))return;
 state={transactions:[],accounts:[],pots:[],budgets:[],incomeCategories:['Salaris','Kinderbijslag','Toeslagen','Overige inkomsten'],expenseCategories:['Boodschappen','Wonen','Vervoer','Kleding','Kinderen','Huisdieren','Sport','Leuke dingen','Vakantie','Overig']};
 save();render();showPage('home');
}
document.addEventListener('click',e=>{
 const nav=e.target.closest('[data-nav]');if(nav){showPage(nav.dataset.nav);return}
 const act=e.target.closest('[data-action]');if(act){
   const a=act.dataset.action;
   if(a==='income')addTransaction('in'); if(a==='expense')addTransaction('out'); if(a==='transaction')addTransaction(txType); if(a==='account')addAccount();if(a==='pot')addPot();if(a==='budget')addBudget();return;
 }
 if(e.target.id==='modalClose'||e.target===document.getElementById('modalBack')){closeModal();return}
 if(e.target.id==='txOut'){txType='out';document.getElementById('txOut').classList.add('active');document.getElementById('txIn').classList.remove('active');renderTransactions()}
 if(e.target.id==='txIn'){txType='in';document.getElementById('txIn').classList.add('active');document.getElementById('txOut').classList.remove('active');renderTransactions()}
 const q=e.target.closest('[data-edit-tx]');if(q){addTransaction(state.transactions[+q.dataset.editTx].type,+q.dataset.editTx);return}
 const d=e.target.closest('[data-delete-tx]');if(d){deleteConfirm('Deze transactie verwijderen?',()=>state.transactions.splice(+d.dataset.deleteTx,1));return}
 const ea=e.target.closest('[data-edit-account]');if(ea){addAccount(+ea.dataset.editAccount);return}
 const da=e.target.closest('[data-delete-account]');if(da){const i=+da.dataset.deleteAccount;const id=state.accounts[i].id;if(state.transactions.some(t=>t.accountId===id)){alert('Deze rekening wordt nog gebruikt door een transactie. Pas die transacties eerst aan of verwijder ze.');return}deleteConfirm('Deze rekening verwijderen?',()=>state.accounts.splice(i,1));return}
 const ep=e.target.closest('[data-edit-pot]');if(ep){addPot(+ep.dataset.editPot);return}
 const dp=e.target.closest('[data-delete-pot]');if(dp){deleteConfirm('Dit potje en het inlegoverzicht verwijderen?',()=>state.pots.splice(+dp.dataset.deletePot,1));return}
 const ap=e.target.closest('[data-add-pot]');if(ap){addContribution(+ap.dataset.addPot);return}
 const pd=e.target.closest('[data-pot-detail]');if(pd){showPotDetail(+pd.dataset.potDetail);return}
 const eb=e.target.closest('[data-edit-budget]');if(eb){addBudget(+eb.dataset.editBudget);return}
 const db=e.target.closest('[data-delete-budget]');if(db){deleteConfirm('Dit budget verwijderen?',()=>state.budgets.splice(+db.dataset.deleteBudget,1));return}
 const ec=e.target.closest('[data-edit-con]');if(ec){const [i,j]=ec.dataset.editCon.split(':').map(Number);const c=state.pots[i].contributions[j];openModal('Inleg aanpassen','Pas bedrag, datum of omschrijving aan.',`<form><div class="field"><label>Bedrag</label><input name="amount" type="number" step="0.01" required value="${c.amount}"></div><div class="field"><label>Datum</label><input name="date" type="date" required value="${c.date}"></div><div class="field"><label>Omschrijving</label><input name="note" value="${esc(c.note||'Inleg')}"></div><button class="primary">Opslaan</button></form>`,fd=>{c.amount=Number(fd.get('amount'));c.date=fd.get('date');c.note=fd.get('note');save();render();showPotDetail(i)});return}
 const dc=e.target.closest('[data-delete-con]');if(dc){const [i,j]=dc.dataset.deleteCon.split(':').map(Number);deleteConfirm('Deze inleg verwijderen?',()=>state.pots[i].contributions.splice(j,1));return}
 const mac=e.target.closest('[data-modal-add-con]');if(mac){closeModal();setTimeout(()=>addContribution(+mac.dataset.modalAddCon),50);return}
});
document.getElementById('prevMonth').onclick=()=>{viewMonth.setMonth(viewMonth.getMonth()-1);render()};
document.getElementById('nextMonth').onclick=()=>{viewMonth.setMonth(viewMonth.getMonth()+1);render()};
document.getElementById('resetBtn').onclick=resetAll;
render();
</script>
</body>
</html>
